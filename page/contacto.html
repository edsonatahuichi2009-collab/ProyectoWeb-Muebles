
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contáctanos</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f9e9d9;
            color: #351609;
        }

        /* MENU */
        header {
            background-color: #351609;
            color: white;
            padding: 15px 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            font-size: 23px;
        }

        nav a {
            text-decoration: none;
            color: white;
            margin: 12px;
            font-size: 13px;
            font-weight: bold;
        }

        nav a:hover {
            color: #e9c49b;
        }

        /* CONTENEDOR */
        .contenedor {
            min-height: 75vh;
            padding: 40px 8%;
            background: linear-gradient(120deg, #f9e9d9, #edc99f);
        }

        .titulo {
            text-align: center;
            margin-bottom: 40px;
        }

        .titulo h1 {
            font-size: 35px;
            margin-bottom: 10px;
        }

        .titulo p {
            font-size: 17px;
        }

        /* CONTENIDO */
        .contenido {
            display: flex;
            justify-content: space-around;
            align-items: center;
            gap: 40px;
        }

        .informacion {
            width: 45%;
        }

        .dato {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .dato span {
            background-color: #351609;
            color: white;
            width: 42px;
            height: 42px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
        }

        .informacion h3 {
            margin-top: 30px;
            margin-bottom: 18px;
        }

        /* REDES */
        .redes {
            display: flex;
            gap: 18px;
        }

        .redes a {
            text-decoration: none;
            background-color: #351609;
            color: white;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* FORMULARIO */
        .formulario {
            width: 48%;
            background-color: #e9c49b;
            padding: 30px;
            border-radius: 20px;
        }

        .formulario input,
        .formulario textarea {
            width: 100%;
            padding: 13px;
            margin-bottom: 15px;
            border: none;
            border-radius: 10px;
            outline: none;
        }

        .formulario textarea {
            height: 100px;
            resize: none;
        }

        .formulario button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 25px;
            background-color: #351609;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .formulario button:hover {
            background-color: #8b5934;
        }

        /* PIE DE PAGINA */
        footer {
            background-color: #351609;
            color: white;
            text-align: center;
            padding: 18px;
        }

        @media (max-width: 700px) {
            header {
                flex-direction: column;
                gap: 20px;
            }

            nav {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
            }

            .contenido {
                flex-direction: column;
            }

            .informacion,
            .formulario {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <header>
        <h2>🏡 Mi Hogar</h2>

        <nav>
            <a href="index.html">INICIO</a>
            <a href="productos.html">PRODUCTOS</a>
            <a href="nosotros.html">NOSOTROS</a>
            <a href="contacto.html">CONTACTO</a>
        </nav>
    </header>

    <main class="contenedor">

        <div class="titulo">
            <h1>✉ Contáctanos</h1>
            <p>Estamos aquí para ayudarte</p>
        </div>

        <section class="contenido">

            <div class="informacion">

                <div class="dato">
                    <span>📞</span>
                    <p>+591 70000000</p>
                </div>

                <div class="dato">
                    <span>✉️</span>
                    <p>mihogar@gmail.com</p>
                </div>

                <div class="dato">
                    <span>📍</span>
                    <p>Cochabamba, Bolivia</p>
                </div>

                <h3>Síguenos en nuestras redes</h3>

                <div class="redes">
                    <a href="#">f</a>
                    <a href="#">◎</a>
                    <a href="#">▶</a>
                </div>

            </div>

            <div class="formulario">

                <form>
                    <input type="text" placeholder="Nombre completo" required>

                    <input type="email" placeholder="Correo electrónico" required>

                    <textarea placeholder="Escribe tu mensaje..." required></textarea>

                    <button type="submit">➤ Enviar mensaje</button>
                </form>

            </div>

        </section>
    </main>

    <footer>
        <p>© 2026 Mi Hogar | Todos los derechos reservados</p>
    </footer>

</body>
</html>
