<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Muebles Elegance</title>

<style>

/* =========================
   CONFIGURACION GENERAL
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Georgia, serif;
    background: #3b2116;
    overflow-x: hidden;
}

/* =========================
   ENCABEZADO
========================= */

header {
    width: 100%;
    height: 63px;
    background: #3b2116;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 5%;
    position: relative;
    z-index: 10;
}

/* LOGOTIPO */

.logo {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #f3d2a6;
}

.logo svg {
    width: 75px;
    height: 55px;
}

.logo h2 {
    font-size: 20px;
    line-height: 18px;
    font-weight: bold;
}

/* MENU */

nav {
    display: flex;
    align-items: center;
    gap: 8px;
}

nav a {
    text-decoration: none;
    color: white;
    font-family: Arial, sans-serif;
    font-size: 11px;

    padding: 10px 14px;
    border-radius: 25px;

    transition: 0.3s;
}

nav a:hover {
    background: #eac69f;
    color: #3b2116;
}

nav .inicio {
    background: #eac69f;
    color: #3b2116;
    font-weight: bold;
}

/* REDES SOCIALES */

.redes {
    display: flex;
    align-items: center;
    gap: 12px;
}

.redes a {
    color: white;
    text-decoration: none;
    display: flex;
    align-items: center;
}

.redes svg {
    width: 19px;
    height: 19px;
    fill: none;
    stroke: white;
    stroke-width: 2;
}

/* =========================
   PORTADA PRINCIPAL
========================= */

.hero {
    width: 100%;
    height: 277px;

    position: relative;

    background-image:
        linear-gradient(
            90deg,
            rgba(47, 25, 14, 0.85) 0%,
            rgba(47, 25, 14, 0.48) 35%,
            rgba(47, 25, 14, 0.02) 75%
        ),
        url("img/sala1.jpg");

    background-size: cover;
    background-position: center;
    display: flex;
    align-items: center;

    padding-left: 9%;
    overflow: hidden;
}

/* =========================
   TEXTO PRINCIPAL
========================= */

.contenido {
    position: relative;
    z-index: 3;
    color: white;
    margin-top: -5px;
}

.contenido h1 {
    font-size: clamp(42px, 7vw, 55px);
    line-height: 0.85;
    letter-spacing: -2px;
    margin-bottom: 13px;
}

.contenido p {
    font-size: 17px;
    line-height: 1.25;
    font-style: italic;
    color: #f5e6d7;
    margin-bottom: 12px;
}

/* =========================
   BOTON CATALOGO
========================= */

.boton {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 14px;

    padding: 9px 20px;

    background: #f0cda6;
    color: #392116;

    text-decoration: none;
    font-family: Arial, sans-serif;
    font-size: 13px;
    font-weight: bold;

    border-radius: 30px;
    transition: 0.3s;
}

.boton:hover {
    background: white;
    transform: translateY(-2px);
}

/* =========================
   CURVA DECORATIVA
========================= */

.curva {
    position: absolute;
    bottom: -1px;
    left: 0;
    width: 100%;
    height: 65px;
    z-index: 2;
    pointer-events: none;
}

.curva svg {
    width: 100%;
    height: 100%;
}

/* =========================
   INDICADORES
========================= */

.indicadores {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);

    display: flex;
    gap: 8px;

    z-index: 5;
}

.indicadores button {
    width: 9px;
    height: 9px;
    border: 1px solid white;
    border-radius: 50%;
    background: transparent;
    cursor: pointer;
}

.indicadores button.activo {
    background: white;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 700px) {

    header {
        height: auto;
        padding: 12px 5%;
        flex-wrap: wrap;
        gap: 12px;
    }

    .logo svg {
        width: 55px;
    }

    .logo h2 {
        font-size: 17px;
    }

    nav {
        width: 100%;
        justify-content: center;
        flex-wrap: wrap;
        gap: 2px;
    }

    nav a {
        font-size: 10px;
        padding: 9px;
    }

    .redes {
        display: none;
    }

    .hero {
        height: 430px;
        padding-left: 7%;
        background-position: 60% center;
    }

    .contenido h1 {
        font-size: 47px;
    }

    .contenido p {
        font-size: 16px;
    }

}

</style>
</head>

<body>

<!-- =========================
     ENCABEZADO
========================= -->

<header>

    <!-- LOGOTIPO -->

    <div class="logo">

        <svg viewBox="0 0 100 75"
             xmlns="http://www.w3.org/2000/svg">

            <!-- TECHO -->
            <path d="M5 35 L50 3 L95 35"
                  fill="none"
                  stroke="#f3d2a6"
                  stroke-width="5"/>

            <!-- PAREDES -->
            <path d="M17 32 V66 H83 V32"
                  fill="none"
                  stroke="#f3d2a6"
                  stroke-width="4"/>

            <!-- SOFA -->
            <rect x="25" y="40"
                  width="50" height="20"
                  rx="3"
                  fill="#eac69f"/>

            <rect x="29" y="35"
                  width="42" height="18"
                  rx="3"
                  fill="#f3d2a6"/>

            <rect x="33" y="40"
                  width="34" height="10"
                  rx="2"
                  fill="#fff0dc"/>

            <!-- PATAS -->
            <path d="M30 60 V65 M70 60 V65"
                  stroke="#f3d2a6"
                  stroke-width="3"/>

        </svg>

        <h2>
            Muebles<br>
            Elegance
        </h2>

    </div>


    <!-- MENU DE NAVEGACION -->

    <nav>

        <a href="#" class="inicio">Inicio</a>

        <a href="#catalogo">Catálogo</a>

        <a href="#nosotros">Sobre Nosotros</a>

        <a href="#contacto">Contáctanos</a>

    </nav>


    <!-- REDES SOCIALES -->

    <div class="redes">

        <!-- WHATSAPP -->

        <a href="https://wa.me/59170000000"
           target="_blank"
           aria-label="WhatsApp">

            <svg viewBox="0 0 24 24">
                <path d="M21 11.5a8.5 8.5 0 0 1-12.5 7.5L3 21l2-5.5A8.5 8.5 0 1 1 21 11.5Z"/>
                <path d="M9 9c1 3 3 5 6 6l1.5-1.5"/>
            </svg>

        </a>

        <!-- INSTAGRAM -->

        <a href="#"
           aria-label="Instagram">

            <svg viewBox="0 0 24 24">
                <rect x="3" y="3"
                      width="18" height="18"
                      rx="5"/>

                <circle cx="12" cy="12" r="4"/>

                <circle cx="18" cy="6" r="1"
                        fill="white"/>
            </svg>

        </a>

        <!-- FACEBOOK -->

        <a href="#"
           aria-label="Facebook">

            <svg viewBox="0 0 24 24">
                <path d="M14 21V13h3l1-4h-4V7
                         c0-1 1-2 2-2h2V2h-3
                         c-4 0-5 2-5 5v2H7v4h3v8z"/>
            </svg>

        </a>

    </div>

</header>


<!-- =========================
     PORTADA PRINCIPAL
========================= -->

<main class="hero" id="inicio">

    <div class="contenido">

        <h1>
            Muebles<br>
            Elegance
        </h1>

        <p>
            Transformamos tus espacios,<br>
            creamos tu comodidad
        </p>

        <a href="#catalogo" class="boton">

            Ver Catálogo

            <span>→</span>

        </a>

    </div>


    <!-- CURVA INFERIOR -->

    <div class="curva">

        <svg viewBox="0 0 1200 100"
             preserveAspectRatio="none">

            <path
                d="M0 0
                   C100 45 130 95 260 75
                   C390 55 420 25 540 55
                   C690 95 760 80 900 55
                   C1030 35 1100 60 1200 75
                   L1200 100
                   L0 100 Z"
                fill="#eac69f"/>

            <path
                d="M0 30
                   C100 70 150 100 280 75
                   C400 50 460 35 580 65
                   C720 100 820 90 950 70
                   C1060 55 1120 75 1200 85
                   L1200 100
                   L0 100 Z"
                fill="#3b2116"/>

        </svg>

    </div>


    <!-- INDICADORES DEL CARRUSEL -->

    <div class="indicadores">

        <button class="activo"
                onclick="cambiarImagen(0)"></button>

        <button onclick="cambiarImagen(1)"></button>

        <button onclick="cambiarImagen(2)"></button>

    </div>

</main>


<!-- =========================
     JAVASCRIPT
========================= -->

<script>

const imagenes = [
    "img/sala1.jpg",
    "img/sala2.jpg",
    "img/sala3.jpg"
];

function cambiarImagen(numero) {

    const hero = document.querySelector(".hero");

    hero.style.backgroundImage = `
        linear-gradient(
            90deg,
            rgba(47,25,14,0.85),
            rgba(47,25,14,0.02)
        ),
        url("${imagenes[numero]}")
    `;

    const botones = document.querySelectorAll(
        ".indicadores button"
    );

    botones.forEach((boton, indice) => {

        boton.classList.toggle(
            "activo",
            indice === numero
        );

    });

}

</script>

</body>
</html>
